[project]
name = "andrey"
version = "0.1.0"
description = "Flask веб-сервис с мультимодальным чатом GigaChat (текст, фото, аудио), биллингом и историей транзакций"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.3",
    "gigachat>=0.2.3",
    "mysql-connector-python>=9.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
andrey = "andrey:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
