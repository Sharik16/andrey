<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница авторизации</title>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --text: #e9e9f2;
            --muted: rgba(226, 226, 240, 0.55);
            --accent: #6c5ce7;
            --accent-2: #8b7dc4;
            --glass-bg: rgba(255, 255, 255, 0.045);
            --glass-border: rgba(255, 255, 255, 0.10);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif;
            background:
                radial-gradient(60% 55% at 18% 12%, rgba(110, 96, 170, 0.25), transparent 60%),
                radial-gradient(60% 55% at 85% 90%, rgba(70, 110, 140, 0.20), transparent 60%),
                #0d0d14;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 30px 28px 26px;
            border-radius: 24px;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--glass-border);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -1px 0 rgba(255, 255, 255, 0.03),
                0 16px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent);
            pointer-events: none;
        }
        .brand {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .brand-mark {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(124, 110, 210, 0.95), rgba(96, 84, 170, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.20),
                0 8px 18px rgba(0, 0, 0, 0.30);
            color: #fff;
        }
        .brand-mark svg { width: 22px; height: 22px; }
        .auth-card h1 {
            margin: 0 0 2px;
            font-size: 21px;
            font-weight: 650;
            color: #fff;
            letter-spacing: 0.2px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 13px;
        }
        .form-group {
            position: relative;
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            outline: none;
            font-size: 14px;
            font-family: inherit;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .form-group input::placeholder {
            color: rgba(226, 226, 240, 0.35);
        }
        .form-group input:focus {
            border-color: rgba(150, 134, 220, 0.6);
            background: rgba(255, 255, 255, 0.07);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.10),
                0 0 0 3px rgba(108, 92, 231, 0.16);
        }
        button {
            position: relative;
            width: 100%;
            padding: 13px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            margin-top: 10px;
            background: linear-gradient(180deg, rgba(112, 96, 200, 0.95), rgba(92, 80, 168, 0.95));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 8px 20px rgba(0, 0, 0, 0.30);
            transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        button:hover {
            filter: brightness(1.06);
        }
        button:active {
            transform: scale(0.98);
        }
        .switch-link {
            position: relative;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }
        .switch-link a {
            color: #b9b0e6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .switch-link a:hover {
            color: #d6cffc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        </div>
        <div>
            <h1>Вход в систему</h1>
            <div class="subtitle">Войдите в свой аккаунт</div>
        </div>
    </div>

    <form id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@mail.ru" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>
        </div>
        <button type="submit">Войти</button>
    </form>

    <div class="switch-link">
        Нет аккаунта? <a href="/">Зарегистрироваться</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"
        integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
