<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещён</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif;
            background:
                radial-gradient(60% 55% at 18% 12%, rgba(110, 96, 170, 0.25), transparent 60%),
                radial-gradient(60% 55% at 85% 90%, rgba(70, 110, 140, 0.20), transparent 60%),
                #0d0d14;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #e9e9f2;
            -webkit-font-smoothing: antialiased;
        }
        .box {
            position: relative;
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.045);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -1px 0 rgba(255, 255, 255, 0.03),
                0 16px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .box::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent);
            pointer-events: none;
        }
        h1 {
            position: relative;
            margin: 0 0 12px;
            font-size: 56px;
            font-weight: 700;
            color: #d98a97;
        }
        p {
            position: relative;
            color: rgba(226, 226, 240, 0.55);
            margin: 0 0 24px;
        }
        a {
            position: relative;
            display: inline-block;
            padding: 12px 22px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: linear-gradient(180deg, rgba(112, 96, 200, 0.95), rgba(92, 80, 168, 0.95));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 8px 20px rgba(0, 0, 0, 0.30);
            transition: transform 0.12s ease, filter 0.2s ease;
        }
        a:hover {
            filter: brightness(1.06);
        }
        a:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="box">
    <h1>403</h1>
    <p>У вас нет прав для доступа к этой странице.</p>
    <a href="/profile">← В личный кабинет</a>
</div>
</body>
</html>
